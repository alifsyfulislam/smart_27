{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:40px auto;text-align:center">
  <div class="card-body">
    <i class="fa-solid {{ 'fa-lock' if '403' in title else 'fa-compass' }}" style="font-size:52px;color:#1877f2"></i>
    <h1 style="margin:14px 0 4px;font-size:22px">{{ title }}</h1>
    <p style="color:#65676b">{{ message }}</p>
    <a class="btn btn-primary" href="/"><i class="fa-solid fa-house"></i> Back to Dashboard</a>
  </div>
</div>
{% endblock %}
